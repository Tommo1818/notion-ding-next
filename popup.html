<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Ding</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <img src="assets/ding-icon.32.png" alt="Notion Ding" class="app-icon" width="24" height="24">
        <div>
          <h1 class="title">Notion Ding</h1>
          <p class="subtitle">Task completion sound reward</p>
        </div>
      </div>
      <label class="toggle-switch" title="Toggle sound on/off">
        <input type="checkbox" id="enabled-toggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Productivity & Streak Hero Card -->
    <div class="stats-card">
      <div class="stats-main">
        <div class="stats-content">
          <span class="stats-number" id="tasks-counter">0</span>
          <div class="stats-meta">
            <span class="stats-label">Tasks Completed</span>
            <span class="stats-subtext">Checked off in Notion</span>
          </div>
        </div>
        <div class="stats-badge" title="Productivity achievement">
          <img src="assets/checkmark.svg" alt="Check" width="16" height="16">
        </div>
      </div>
      <div class="stats-extra">
        <div class="stat-pill" title="Tasks completed today">
          <span class="pill-label">Today:</span>
          <strong id="today-counter">0</strong>
        </div>
        <div class="stat-pill" title="Daily completion streak">
          <span class="pill-icon">🔥</span>
          <strong id="streak-counter">0-day streak</strong>
        </div>
        <button id="reset-stats-btn" class="text-btn" title="Reset completion counters">Reset</button>
      </div>
    </div>

    <!-- Sound Theme Selector -->
    <section class="section">
      <div class="section-label">
        <span>Sound Theme</span>
      </div>
      <select id="sound-theme-select" class="select-input">
        <option value="ding">Classic Ding 🔔</option>
        <option value="marimba">Marimba Chime 🪵</option>
        <option value="pop">Subtle Pop 🫧</option>
        <option value="click">Mechanical Switch ⌨️</option>
        <option value="zen">Zen Singing Bowl 🧘</option>
      </select>
    </section>

    <!-- Completion Animation Selector -->
    <section class="section">
      <div class="section-label">
        <span>Completion Animation</span>
      </div>
      <select id="anim-style-select" class="select-input">
        <option value="both">Both (Ripple & Confetti ✨)</option>
        <option value="ripple">Subtle Ripple 🟢</option>
        <option value="confetti">Micro Confetti 🎊</option>
        <option value="none">None (Audio Only)</option>
      </select>
    </section>

    <!-- Volume Control -->
    <section class="section">
      <div class="section-label">
        <span>Sound Volume</span>
        <span id="volume-badge" class="badge">6/10</span>
      </div>

      <div class="volume-slider-row">
        <button id="quieter-btn" class="icon-btn" aria-label="Decrease volume" title="Softer">
          <img src="assets/volume-down-fill.svg" alt="Quieter" width="16" height="16">
        </button>
        <input type="range" id="volume-slider" min="0" max="10" step="1" value="6" class="volume-range">
        <button id="louder-btn" class="icon-btn" aria-label="Increase volume" title="Louder">
          <img src="assets/volume-up-fill.svg" alt="Louder" width="16" height="16">
        </button>
      </div>
      <div class="volume-caption" id="volume-caption">Standard (60%)</div>
    </section>

    <!-- Options: Chromatic Pitch Modulation -->
    <section class="options-group">
      <label class="checkbox-option">
        <input type="checkbox" id="pitch-toggle" checked>
        <span>Chromatic Scale (+1 semitone per combo task 🎵)</span>
      </label>
    </section>

    <!-- Test Audio Button -->
    <section class="test-row">
      <button id="test-sound-btn" class="test-btn" title="Preview the sound theme">
        <span class="btn-icon">🔔</span>
        <span>Test Sound</span>
      </button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">Active on notion.com & notion.so</span>
      </div>
      <span class="version-tag">v2.1.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
